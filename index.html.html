<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Template</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col">

  <!-- 1. แถบเมนูด้านบน (Navbar) -->
  <nav class="h-16 border-b border-slate-800 flex items-center justify-between px-6">
    <div><!-- โลโก้ --></div>
    <div class="flex gap-6"><!-- เมนูต่างๆ --></div>
  </nav>

  <!-- 2. พื้นที่หลัก 3 คอลัมน์ -->
  <div class="max-w-[1600px] w-full mx-auto p-4 grid grid-cols-1 lg:grid-cols-12 gap-4 flex-1">
    
    <!-- คอลัมน์ซ้าย (Sidebar ซ้าย) -->
    <aside class="lg:col-span-3 border border-slate-800 rounded-xl p-4">
      <!-- ใส่เนื้อหาฝั่งซ้ายตรงนี้ -->
    </aside>

    <!-- คอลัมน์กลาง (Main Content) -->
    <main class="lg:col-span-6 border border-slate-800 rounded-xl p-4 space-y-4">
      <!-- ส่วนหัวข้อหลัก / ช่องค้นหา -->
      <div class="h-24 border border-slate-800 rounded-lg"></div>
      
      <!-- พื้นที่แสดงรายการไฟล์ (Grid) -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div class="h-48 border border-slate-800 rounded-lg"></div>
        <div class="h-48 border border-slate-800 rounded-lg"></div>
      </div>
    </main>

    <!-- คอลัมน์ขวา (Sidebar ขวา) -->
    <aside class="lg:col-span-3 border border-slate-800 rounded-xl p-4">
      <!-- ใส่เนื้อหาฝั่งขวาตรงนี้ -->
    </aside>

  </div>

</body>
</html>
